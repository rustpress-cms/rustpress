name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Static binary for the release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p rustpress-server --target x86_64-unknown-linux-musl
      - run: |
          cp target/x86_64-unknown-linux-musl/release/rustpress-server rustpress-x86_64-linux-musl
          sha256sum rustpress-x86_64-linux-musl > rustpress-x86_64-linux-musl.sha256
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            rustpress-x86_64-linux-musl
            rustpress-x86_64-linux-musl.sha256
