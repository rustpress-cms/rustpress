name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Without the reference WordPress stack the golden tests skip themselves here; the job golden runs them.
      - run: cargo test --workspace --locked

  golden:
    name: Golden tests and compat run
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # The tests that compare with WordPress fail instead of skipping themselves when the reference is missing.
      RUSTPRESS_REQUIRE_REFERENCE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start the reference stack (MariaDB + WordPress)
        run: |
          # The dev/ scripts are written for Podman; dev/ci/podman runs them on the runner's Docker.
          echo "$PWD/dev/ci" >> "$GITHUB_PATH"
          export PATH="$PWD/dev/ci:$PATH"
          dev/up.sh
          # The entrypoint first runs a temporary server without networking: wait for the real one.
          until podman exec rustpress-db mariadb -h127.0.0.1 -uwordpress -pwordpress -e "SELECT 1" wordpress >/dev/null 2>&1; do sleep 2; done
          until curl -so /dev/null http://127.0.0.1:8080/; do sleep 2; done
          # The seeds (dev/seed_patterns.sh) and the tests read the WordPress files of the Docker volume.
          sudo chmod o+x /var/lib/docker /var/lib/docker/volumes
      - name: Seed the reference
        run: |
          dev/seed.sh
          # For crates/rustpress-core/tests/i18n_coverage.rs; installed, not activated (the site stays en_US).
          dev/wp.sh language core install de_DE
          dev/wp.sh core version
      - name: Golden tests
        run: dev/test.sh --locked --no-fail-fast
      - name: Compat run
        run: |
          cargo run --locked -p rustpress-compat -- --wp-root "$(podman volume inspect rustpress-wp -f '{{.Mountpoint}}')" \
            --report compat/reports/ci.md
      - name: Compat report
        if: always()
        run: test -f compat/reports/ci.md && cat compat/reports/ci.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: compat-report
          path: compat/reports/ci.md
          if-no-files-found: ignore

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Fails on a known vulnerability in Cargo.lock (RustSec); "unmaintained" notices are only printed.
      - run: cargo audit

  musl:
    name: Static binary (musl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p rustpress-server --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v7
        with:
          name: rustpress-x86_64-linux-musl
          path: target/x86_64-unknown-linux-musl/release/rustpress-server

  windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked -p rustpress-server

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: rustpress:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
