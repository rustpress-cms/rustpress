# RustPress with MariaDB.
#
# An existing WordPress site: point WORDPRESS_DIR in .env at the WordPress folder (with wp-config.php), import the
# database dump and run `docker compose up -d`.
#
# A new site:
#   cp .env.example .env            # set the password and address
#   docker compose up -d            # creates ./wordpress with the WordPress files and starts everything
#   docker compose run --rm wp config create --dbname=wordpress --dbuser=wordpress --dbpass="$DB_PASSWORD" --dbhost=db
#   docker compose run --rm wp core install --url="$SITE_URL" --title="My Site" \
#     --admin_user=admin --admin_email=me@example.com --prompt=admin_password
#   docker compose restart rustpress
#
# TLS is left to a reverse proxy in front (Caddy, Traefik, nginx); RustPress listens on port 3000.

services:
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 20

  # Copies the WordPress files (wp-includes/, wp-admin/ assets, default themes) once; RustPress serves them.
  wp-files:
    image: wordpress:latest
    restart: "no"
    entrypoint: ["sh", "-c", "test -e /var/www/html/wp-includes || cp -a /usr/src/wordpress/. /var/www/html/; chown -R 33:33 /var/www/html/wp-content"]
    volumes:
      - ${WORDPRESS_DIR:-./wordpress}:/var/www/html

  rustpress:
    build: .
    image: rustpress
    restart: unless-stopped
    # The same user as PHP in the WordPress images, so uploads land with the right owner.
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
      wp-files:
        condition: service_completed_successfully
    environment:
      RUSTPRESS_DATABASE_URL: mysql://wordpress:${DB_PASSWORD}@db:3306/wordpress
      RUSTPRESS_ALLOW_WRITES: ${ALLOW_WRITES:-1}
    volumes:
      - ${WORDPRESS_DIR:-./wordpress}:/var/www/html
    ports:
      - "${PORT:-3000}:3000"

  # WP-CLI for setting up a new site; only runs on demand (`docker compose run --rm wp …`).
  wp:
    image: wordpress:cli
    profiles: ["tools"]
    entrypoint: ["wp"]
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${WORDPRESS_DIR:-./wordpress}:/var/www/html

volumes:
  db:
