	<script type="text/html" id="tmpl-customize-themes-details-view">
		<div class="theme-backdrop"></div>
		<div class="theme-wrap wp-clearfix" role="document">
			<div class="theme-header">
				<button type="button" class="left dashicons dashicons-no"><span class="screen-reader-text">
					⟦r¦¦Show previous theme⟧				</span></button>
				<button type="button" class="right dashicons dashicons-no"><span class="screen-reader-text">
					⟦r¦¦Show next theme⟧				</span></button>
				<button type="button" class="close dashicons dashicons-no"><span class="screen-reader-text">
					⟦r¦¦Close details dialog⟧				</span></button>
			</div>
			<div class="theme-about wp-clearfix">
				<div class="theme-screenshots">
				<# if ( data.screenshot && data.screenshot[0] ) { #>
					<div class="screenshot"><img src="{{ data.screenshot[0] }}?ver={{ data.version }}" alt="" /></div>
				<# } else { #>
					<div class="screenshot blank"></div>
				<# } #>
				</div>

				<div class="theme-info">
					<# if ( data.active ) { #>
						<span class="current-label">⟦r¦¦Active Theme⟧</span>
					<# } #>
					<h2 class="theme-name">{{{ data.name }}}<span class="theme-version">
						⟦r¦¦Version: ⟪%s¦{{ data.version }}⟫⟧					</span></h2>
					<h3 class="theme-author">
						⟦r¦¦By ⟪%s¦{{{ data.authorAndUri }}}⟫⟧					</h3>

					<# if ( data.stars && 0 != data.num_ratings ) { #>
						<div class="theme-rating">
							{{{ data.stars }}}
							<a class="num-ratings" target="_blank" href="{{ data.reviews_url }}">
								⟦r¦¦(⟪%s¦{{ data.num_ratings }}⟫ ratings)⟧ <span class="screen-reader-text">⟦r¦¦(opens in a new tab)⟧</span>							</a>
						</div>
					<# } #>

					<# if ( data.hasUpdate ) { #>
						<# if ( data.updateResponse.compatibleWP && data.updateResponse.compatiblePHP ) { #>
							<div class="notice notice-warning notice-alt notice-large" data-slug="{{ data.id }}">
								<h3 class="notice-title">⟦r¦¦Update Available⟧</h3>
								{{{ data.update }}}
							</div>
						<# } else { #>
							<div class="notice notice-error notice-alt notice-large" data-slug="{{ data.id }}">
								<h3 class="notice-title">⟦r¦¦Update Incompatible⟧</h3>
								<p>
									<# if ( ! data.updateResponse.compatibleWP && ! data.updateResponse.compatiblePHP ) { #>
										⟦r¦¦There is a new version of ⟪%s¦{{{ data.name }}}⟫ available, but it does not work with your versions of WordPress and PHP.⟧ ⟦r¦¦<a href="⟪%1$s¦{{admin}}update-core.php⟫">Please update WordPress</a>, and then <a href="⟪%2$s¦⟦r¦localized PHP upgrade information page¦https://wordpress.org/support/update-php/⟧⟫">learn more about updating PHP</a>.⟧									<# } else if ( ! data.updateResponse.compatibleWP ) { #>
										⟦r¦¦There is a new version of ⟪%s¦{{{ data.name }}}⟫ available, but it does not work with your version of WordPress.⟧ ⟦r¦¦<a href="⟪%s¦{{admin}}update-core.php⟫">Please update WordPress</a>.⟧									<# } else if ( ! data.updateResponse.compatiblePHP ) { #>
										⟦r¦¦There is a new version of ⟪%s¦{{{ data.name }}}⟫ available, but it does not work with your version of PHP.⟧ ⟦r¦¦<a href="⟪%s¦⟦r¦localized PHP upgrade information page¦https://wordpress.org/support/update-php/⟧⟫">Learn more about updating PHP</a>.⟧									<# } #>
								</p>
							</div>
						<# } #>
					<# } #>

					<# if ( data.parent ) { #>
						<p class="parent-theme">
							⟦r¦¦This is a child theme of ⟪%s¦<strong>{{{ data.parent }}}</strong>⟫.⟧						</p>
					<# } #>

					<# if ( ! data.compatibleWP || ! data.compatiblePHP ) { #>
						<div class="notice notice-error notice-alt notice-large"><p>
							<# if ( ! data.compatibleWP && ! data.compatiblePHP ) { #>
								⟦r¦¦This theme does not work with your versions of WordPress and PHP.⟧ ⟦r¦¦<a href="⟪%1$s¦{{admin}}update-core.php⟫">Please update WordPress</a>, and then <a href="⟪%2$s¦⟦r¦localized PHP upgrade information page¦https://wordpress.org/support/update-php/⟧⟫">learn more about updating PHP</a>.⟧							<# } else if ( ! data.compatibleWP ) { #>
								⟦r¦¦This theme does not work with your version of WordPress.⟧ ⟦r¦¦<a href="⟪%s¦{{admin}}update-core.php⟫">Please update WordPress</a>.⟧							<# } else if ( ! data.compatiblePHP ) { #>
								⟦r¦¦This theme does not work with your version of PHP.⟧ ⟦r¦¦<a href="⟪%s¦⟦r¦localized PHP upgrade information page¦https://wordpress.org/support/update-php/⟧⟫">Learn more about updating PHP</a>.⟧							<# } #>
						</p></div>
					<# } else if ( ! data.active && data.blockTheme ) { #>
						<div class="notice notice-error notice-alt notice-large"><p>
						⟦r¦¦This theme doesn't support Customizer.⟧						<# if ( data.actions.activate ) { #>
							 ⟦r¦¦However, you can still <a href="⟪%s¦{{{ data.actions.activate }}}⟫">activate this theme</a>, and use the Site Editor to customize it.⟧						<# } #>
						</p></div>
					<# } #>

					<p class="theme-description">{{{ data.description }}}</p>

					<# if ( data.tags ) { #>
						<p class="theme-tags"><span>⟦r¦¦Tags:⟧</span> {{{ data.tags }}}</p>
					<# } #>
				</div>
			</div>

			<div class="theme-actions">
				<# if ( data.active ) { #>
					<button type="button" class="button button-primary customize-theme">⟦r¦¦Customize⟧</button>
				<# } else if ( 'installed' === data.type ) { #>
					<div class="theme-inactive-actions">
					<# if ( data.blockTheme ) { #>
												<# if ( data.compatibleWP && data.compatiblePHP && data.actions.activate ) { #>
							<a href="{{{ data.actions.activate }}}" class="button button-primary activate" aria-label="⟦a¦theme¦Activate ⟪%s¦{{ data.name }}⟫⟧">⟦r¦¦Activate⟧</a>
						<# } #>
					<# } else { #>
						<# if ( data.compatibleWP && data.compatiblePHP ) { #>
							<button type="button" class="button button-primary preview-theme" data-slug="{{ data.id }}">⟦r¦¦Live Preview⟧</button>
						<# } else { #>
							<button class="button button-primary disabled">⟦r¦¦Live Preview⟧</button>
						<# } #>
					<# } #>
					</div>
											<# if ( data.actions && data.actions['delete'] ) { #>
							<a href="{{{ data.actions['delete'] }}}" data-slug="{{ data.id }}" class="button button-secondary delete-theme">⟦r¦¦Delete⟧</a>
						<# } #>
									<# } else { #>
					<# if ( data.compatibleWP && data.compatiblePHP ) { #>
						<button type="button" class="button theme-install" data-slug="{{ data.id }}">⟦r¦¦Install⟧</button>
						<button type="button" class="button button-primary theme-install preview" data-slug="{{ data.id }}">⟦r¦¦Install &amp; Preview⟧</button>
					<# } else { #>
						<button type="button" class="button disabled">⟦r¦theme¦Cannot Install⟧</button>
						<button type="button" class="button button-primary disabled">⟦r¦¦Install &amp; Preview⟧</button>
					<# } #>
				<# } #>
			</div>
		</div>
	</script>
