# Documented deviations from WordPress (see crates/rustpress-compat).
#
# A deviation silences differences on URLs whose path (with query string) matches `path`
# (a regular expression). `aspect` is `*` (default), a single aspect such as `status` or
# `body`, or a prefix ending in `*` such as `header:*`. `theme` limits an entry to one theme.
# Every entry needs a `reason`; the report lists what was seen and what was not.

[[deviation]]
path = '^/(wp-login[.]php|wp-admin/|xmlrpc[.]php|wp-cron[.]php)'
reason = "The compat run uses RustPress without allow_writes, so sign-in and wp-admin stay closed; XML-RPC and wp-cron.php do not exist. Sign-in and wp-admin are compared with their own scripts in dev/ (login-compare.sh, admin-compare.sh and others)."

[[deviation]]
path = '^/wp-json/$'
aspect = "bytes"
reason = "The route index at /wp-json/ lists only the routes RustPress serves itself (a subset)."

[[deviation]]
path = '^/wp-(content|includes)/'
aspect = "header:cache-control"
reason = "RustPress deliberately sends Cache-Control: public, max-age=86400 for static files; the reference's Apache sends none."

[[deviation]]
path = '^/wp-sitemap-posts-post-9999[.]xml$'
aspect = "bytes"
reason = "The 404 page of a missing sitemap differs from WordPress only in whitespace in the head."

[[deviation]]
path = '^/category/uncategorized/page/2/$'
aspect = "body"
reason = "Posts with exactly the same date (here gleich-a/gleich-b) have no defined order in MariaDB; it depends on the query plan and can differ between WordPress and RustPress."

[[deviation]]
path = '^/(\?s=test&feed=rss2|search/test/feed/rss2/)$'
aspect = "bytes"
reason = "The search results sort by title match and date only, and dev/seed_patterns.sh creates many pattern pages in the same second; their order is not defined in MariaDB and depends on the query plan."

# --- Sites with plain permalinks (dev/up-soli.sh, the copy of a real site) ---

[[deviation]]
path = '^/[?]rest_route=/$'
aspect = "bytes"
reason = "The route index lists only the routes RustPress serves itself (a subset)."

[[deviation]]
path = '^/(robots[.]txt|favicon[.]ico)$'
reason = "Without permalink rules WordPress does not know these files and redirects /robots.txt to /robots.txt/ (a quirk of plain permalinks); RustPress answers 404."

[[deviation]]
path = '^/wp-content/uploads/'
reason = "The reference copy of the real site does not have its uploaded files (they stay with the site owner); without the file the two sides answer differently."

[[deviation]]
path = '^/(wp-config[.]php|[.]htaccess|wp-content/|wp-includes/)$'
reason = "Behaviour of the reference's Apache and PHP (empty index.php, 403 for directories and dotfiles, an executed wp-config.php); RustPress only serves assets."

[[deviation]]
path = '^/(license[.]txt|readme[.]html)$'
reason = "The reference's Apache sends no Cache-Control header for static files; RustPress deliberately sends public, max-age=86400."
aspect = "header:cache-control"

[[deviation]]
path = '^/wp-json/wp/v2/pages[?]parent=0&orderby=menu_order$'
reason = "Pages with the same menu_order have no defined order in MariaDB."
