# Documented deviations from WordPress (see crates/rustpress-compat).
#
# A deviation silences differences on URLs whose path (with query string) matches `path`
# (a regular expression). `aspect` is `*` (default), a single aspect such as `status` or
# `body`, or a prefix ending in `*` such as `header:*`. `theme` limits an entry to one theme.
# Every entry needs a `reason`; the report lists what was seen and what was not.

[[deviation]]
path = '^/(wp-login[.]php|wp-admin/|xmlrpc[.]php|wp-cron[.]php)'
reason = "Anmeldung, Admin-Oberfläche, XML-RPC und Cron gibt es nicht: RustPress arbeitet nur lesend und ohne PHP."

[[deviation]]
path = '^/wp-json/$'
aspect = "bytes"
reason = "Der Routenindex von /wp-json/ listet nur die Routen, die RustPress selbst bedient (eine Teilmenge)."

[[deviation]]
path = '^/wp-json/wp/v2/(types|taxonomies|statuses|search|settings|block)'
reason = "Diese REST-Routen sind noch nicht umgesetzt (siehe PLAN.md)."

[[deviation]]
path = '[?&]feed='
reason = "Die Referenz auf Port 8080 verliert beim Kanonisieren den Port (WordPress-Eigenheit) und leitet ?feed=… deshalb nicht um; RustPress leitet wie WordPress auf /feed/ um."

[[deviation]]
path = '^/wp-(content|includes)/'
aspect = "header:cache-control"
reason = "RustPress sendet für statische Dateien bewusst Cache-Control: public, max-age=86400; der Apache der Referenz sendet nichts."

[[deviation]]
path = '^/wp-sitemap-posts-post-9999[.]xml$'
aspect = "bytes"
reason = "Die 404-Seite eines fehlenden Sitemaps unterscheidet sich von WordPress nur durch Whitespace im Head."

[[deviation]]
path = '^/category/uncategorized/page/2/$'
aspect = "body"
reason = "Beiträge mit exakt gleichem Datum (hier gleich-a/gleich-b) haben in MariaDB keine definierte Reihenfolge; sie hängt vom Plan der Abfrage ab und kann sich zwischen WordPress und RustPress unterscheiden."

# --- Seiten mit einfachen Permalinks (dev/up-soli.sh, die echte Seite) ---

[[deviation]]
path = '^/[?]rest_route=/$'
aspect = "bytes"
reason = "Der Routenindex listet nur die Routen, die RustPress selbst bedient (eine Teilmenge)."

[[deviation]]
path = '^/[?]rest_route=/wp/v2/(types|taxonomies|statuses|search|settings|block)'
reason = "Diese REST-Routen sind noch nicht umgesetzt (siehe PLAN.md)."

[[deviation]]
path = '^/(robots[.]txt|favicon[.]ico)$'
reason = "Ohne Permalink-Regeln kennt WordPress diese Dateien nicht und leitet /robots.txt auf /robots.txt/ um (Eigenheit einfacher Permalinks); RustPress liefert dafür 404."

[[deviation]]
path = '^/wp-content/uploads/'
reason = "Die Referenz der echten Seite hat die hochgeladenen Dateien nicht (sie liegen beim Betreiber); beide Seiten antworten ohne Datei unterschiedlich."
